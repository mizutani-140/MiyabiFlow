name: AI - Claude Code (Subscription-first)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    runs-on: ubuntu-latest

    # Security: avoid write-capable automation on forked PRs
    if: |
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code Action (OAuth)
        uses: anthropics/claude-code-action@v1
        with:
          # [定額サブスクリプション認証]（Claude Max/Pro）: OAuth token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # GitHub token for commenting / pushing changes
          github_token: ${{ github.token }}

          # PR events: deterministic review skill
          prompt: ${{ github.event_name == 'pull_request' && '/review' || '' }}

          claude_args: |
            --max-turns 6
