name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret scan (placeholder)
        run: |
          echo "Add gitleaks/trufflehog/etc. here."

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "skip"
          fi
