name: AI - Codex Cloud Review Trigger

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  request_codex_review:
    runs-on: ubuntu-latest

    # Avoid running on forked PRs (spamming + permission edge cases)
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Post @codex review comment (once)
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const alreadyRequested = comments.some(c => (c.body || "").includes("@codex review"));
            if (alreadyRequested) {
              core.info("Codex review already requested. Skipping.");
              return;
            }

            const body = [
              "@codex review",
              "",
              "Please review ONLY the changes in this PR.",
              "Follow the closest AGENTS.md review guidelines.",
              "Focus on: security regressions, missing tests, edge cases, performance hotspots.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

            core.info("Posted @codex review request.");
