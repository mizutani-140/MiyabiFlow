name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
      - name: Run CI
        run: |
          make ci
